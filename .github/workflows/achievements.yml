name: Atualizar Achievements
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Auto = primeira coleta completa, depois rápida; ou escolha uma categoria'
        type: choice
        default: auto
        options:
          - auto
          - rapido
          - completo
          - charts
          - mercados
          - artistas
          - premios
          - turnes
      retomar:
        description: 'Retomar checkpoint compatível (desmarque para começar do zero)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: achievements
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ACH_CHECKPOINT_BRANCH: achievements-progress/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Configurar Git para checkpoints
        run: |
          git config user.name 'achievements-bot'
          git config user.email 'achievements-bot@users.noreply.github.com'
      - name: Coletar rankings e criptografar
        env:
          ACH_MODE: ${{ inputs.modo }}
          ACH_RESUME: ${{ inputs.retomar }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PLAYLISTS_KEY: ${{ secrets.PLAYLISTS_KEY }}
          SITE_EMAIL: ${{ secrets.FAMOUS_EMAIL }}
          SITE_PASSWORD: ${{ secrets.FAMOUS_PASSWORD }}
        run: node scrape-achievements.mjs
      - name: Publicar achievements.enc
        run: |
          git config user.name 'achievements-bot'
          git config user.email 'achievements-bot@users.noreply.github.com'
          git add achievements.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "achievements: snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Limpar checkpoint após publicação bem-sucedida
        run: |
          ref="refs/heads/${ACH_CHECKPOINT_BRANCH}"
          head=$(git ls-remote origin "$ref" | cut -f1)
          if [ -n "$head" ]; then
            git push --force-with-lease="$ref:$head" origin ":$ref"
          fi
