name: Atualizar Songs

on:
  # Quem dispara é o Worker (cron no minuto :02 de cada hora).
  # Também dá pra rodar na mão pelo botão "Run workflow".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: songs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Raspar FTunes
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PLAYLISTS_KEY: ${{ secrets.PLAYLISTS_KEY }}
          FTUNES_REGIONS: ${{ secrets.FTUNES_REGIONS }}
        run: deno run --allow-net --allow-write --allow-env=SITE_URL,PLAYLISTS_KEY,FTUNES_REGIONS scrape-ftunes.ts

      - name: Commitar se mudou
        run: |
          git config user.name "playlists-bot"
          git config user.email "playlists-bot@users.noreply.github.com"
          git add songs.enc
          if git diff --cached --quiet -- songs.enc; then
            echo "Sem mudanças, nada a commitar"
            exit 0
          fi
          git commit -m "songs: atualiza $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin ${{ github.ref_name }}
          git push
